name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# NEXT_PUBLIC_* are inlined into the client bundle by `next build` (see DEPLOY.md),
# so the build needs them present even in CI. These are placeholders that only have
# to parse as URLs — src/lib/env.ts validates them with zod, and next.config.ts
# derives the CSP and the image allowlist from them. The real values are passed as
# `--build-arg` at deploy time, which is why an artifact built here is never
# shippable: one image per environment.
env:
  NEXT_PUBLIC_API_URL: http://localhost:8080
  NEXT_PUBLIC_WS_URL: ws://localhost:8080/ws/notifications
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_PUBLIC_PORTAL_URL: http://localhost:3001
  NEXT_PUBLIC_DEFAULT_LOCALE: en

jobs:
  verify:
    name: Lint · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # There is no `typecheck` or `test` script yet. `next build` still runs the
      # TypeScript compiler over the app (typescript.ignoreBuildErrors is unset),
      # so type errors fail this step. The prerendered marketing pages guard every
      # API call with `.catch(...)`, so the build does not need a live backend.
      - name: Build
        run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
            --build-arg NEXT_PUBLIC_WS_URL="$NEXT_PUBLIC_WS_URL" \
            --build-arg NEXT_PUBLIC_SITE_URL="$NEXT_PUBLIC_SITE_URL" \
            --build-arg NEXT_PUBLIC_PORTAL_URL="$NEXT_PUBLIC_PORTAL_URL" \
            --build-arg NEXT_PUBLIC_DEFAULT_LOCALE="$NEXT_PUBLIC_DEFAULT_LOCALE" \
            -t eduplatform-frontend:${{ github.sha }} .
