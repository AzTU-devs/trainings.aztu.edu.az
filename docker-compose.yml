# EduPlatform public frontend — standalone container.
#
#   docker compose up --build
#
# NEXT_PUBLIC_* are build args (inlined into the client bundle), so changing one
# requires `docker compose up --build`, not just a restart.

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL:        ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_WS_URL:         ${NEXT_PUBLIC_WS_URL:-ws://localhost:8080/ws/notifications}
        NEXT_PUBLIC_SITE_URL:       ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_PORTAL_URL:     ${NEXT_PUBLIC_PORTAL_URL:-http://localhost:3001}
        NEXT_PUBLIC_DEFAULT_LOCALE: ${NEXT_PUBLIC_DEFAULT_LOCALE:-en}
        # Required only when running more than one replica.
        NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:-}
    image: eduplatform-frontend:local
    container_name: eduplatform-frontend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # Server-side only, read per request — safe to change without a rebuild.
      # Inside a shared docker network this is the backend service name, not localhost.
      INTERNAL_API_URL:  ${INTERNAL_API_URL:-http://host.docker.internal:8080}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?Set REVALIDATE_SECRET in .env}
      SENTRY_DSN:        ${SENTRY_DSN:-}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
